name: Build Self-Hosted

on:
  workflow_dispatch:
  push:
    branches:
      - canary

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Build frontend
        run: |
          yarn affine @affine/web build
          yarn affine @affine/admin build
          yarn affine @affine/mobile build

      - name: Build server-native
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/server-native'

      - name: Rename native module
        run: |
          mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node

      - name: Build backend
        run: |
          yarn workspace @affine/reader build
          yarn workspace @affine/server build

      - name: Prepare Docker context
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
          yarn workspace @affine/server prisma generate
          mv ./node_modules ./packages/backend/server/

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/affine:latest
            ghcr.io/${{ github.repository_owner }}/affine:${{ github.sha }}
